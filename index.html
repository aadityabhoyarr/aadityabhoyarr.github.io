<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADITYA BHOYAR</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Menlo', 'Courier New', monospace;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: row;
            height: 100vh;
            overflow: hidden;
        }

        .left-panel {
            width: 350px;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 14px;
            overflow: hidden;
        }

        .top-section {
            display: flex;
            flex-direction: column;
        }

        .left-panel h1 {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            margin: 0 0 1rem;
        }

        .left-panel p {
            margin: 0 0 2rem;
            font-size: 12px;
        }

        .works ul {
            list-style: disc;
            padding-left: 1.2rem;
            margin: 0 0 1.5rem;
        }

        .works ul li a {
            color: #000;
            text-decoration: underline;
            font-size: 13px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: 2rem;
        }

        .social-links a {
            color: #000;
            text-decoration: none;
            font-size: 12px;
        }

        .right-panel {
            flex-grow: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 1.5rem;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            align-content: start;
        }

        .right-panel img {
            width: 100%;
            max-width: 100%;
            max-height: 300px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: block;
        }

        @media (max-width: 768px) {
            .left-panel {
                width: 100%;
                height: auto;
            }

            .right-panel {
                padding: 1rem;
                gap: 0.8rem;
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="left-panel">
        <div class="top-section">
            <h1>ADITYA BHOYAR</h1>
            <p>22 | make games , apps and random stuff</p>
            <div class="works">
                <h3>WORKS</h3>
                <ul>
                    <li><a href="/page/games.html">Games</a></li>
                    <li><a href="/page/app.html">Application</a></li>
                    <li><a href="/page/">Random Stuff</a></li>
                </ul>
            </div>
        </div>
        <div class="social-links">
            <a href="https://x.com/aadityabhoyarr">X</a>
            <a href="https://www.linkedin.com/in/aditya-bhoyar-64a052238/">LinkedIn</a>
            <a href="mailto:adityabhoyar.work@gmail.com">Contact</a>
        </div>
    </div>

    <div class="right-panel">
    </div>
</body>

</html>
